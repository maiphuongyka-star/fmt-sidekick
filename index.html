<style>
:root {
  --primary: #C0392B;
  --primary-light: #FDECEA;
  --primary-dark: #922B21;
  --accent: #D4A574;
  --accent-light: #FDF6EE;
  --accent-dark: #B8864A;
  --beige: #F5EFE6;
  --beige-dark: #EDE0D0;
  --success: #27AE60;
  --warning: #E67E22;
  --danger: #C0392B;
  --dark: #2C1810;
  --dark2: #4A2C1A;
  --gray: #8B7355;
  --gray-light: #F5EFE6;
  --white: #FFFDF9;
  --border: #E8D5C0;
  --shadow: 0 2px 16px rgba(192,57,43,0.08);
  --radius: 14px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; background:var(--beige); color:var(--dark); }

/* Ã¢ÂÂÃ¢ÂÂ AUTH Ã¢ÂÂÃ¢ÂÂ */
#auth-screen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #2C1810 0%, #C0392B 50%, #D4A574 100%);
  position:relative; overflow:hidden;
}
#auth-screen::before {
  content:''; position:absolute; inset:0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.auth-box {
  background:var(--white); border-radius:24px; padding:2.5rem; width:100%; max-width:420px;
  box-shadow:0 24px 80px rgba(44,24,16,0.4); position:relative; z-index:1;
}
.auth-logo { text-align:center; margin-bottom:1.5rem; }
.auth-logo h1 { font-size:2rem; font-weight:800; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.auth-logo p { color:var(--gray); font-size:.9rem; margin-top:.25rem; }
.auth-tabs { display:flex; gap:0; background:var(--beige); border-radius:var(--radius-sm); padding:4px; margin-bottom:1.5rem; }
.auth-tab { flex:1; padding:.5rem; text-align:center; border-radius:6px; cursor:pointer; font-size:.85rem; font-weight:500; border:none; background:none; color:var(--gray); transition:.2s; }
.auth-tab.active { background:var(--white); color:var(--primary); box-shadow:0 1px 6px rgba(192,57,43,0.15); }
.auth-form { display:none; }
.auth-form.active { display:block; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; font-size:.78rem; font-weight:700; color:var(--gray); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.06em; }
.form-group input {
  width:100%; padding:.75rem 1rem; border:2px solid var(--border); border-radius:var(--radius-sm);
  font-size:.95rem; outline:none; transition:.2s; background:var(--white); color:var(--dark);
}
.form-group input:focus { border-color:var(--primary); }
.btn-primary {
  width:100%; padding:.85rem; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none;
  border-radius:var(--radius-sm); font-size:1rem; font-weight:700; cursor:pointer; transition:.2s;
  box-shadow:0 4px 15px rgba(192,57,43,0.35);
}
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(192,57,43,0.45); }
.auth-msg { margin-top:.75rem; padding:.6rem 1rem; border-radius:var(--radius-sm); font-size:.85rem; text-align:center; display:none; }
.auth-msg.error { background:#FDECEA; color:var(--danger); display:block; }
.auth-msg.info { background:var(--accent-light); color:var(--accent-dark); display:block; }

/* Ã¢ÂÂÃ¢ÂÂ APP Ã¢ÂÂÃ¢ÂÂ */
#app { display:none; }
.app-layout { display:flex; min-height:100vh; }

/* Sidebar */
.sidebar {
  width:245px; background:var(--dark); color:white; flex-shrink:0;
  display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100;
  border-right:1px solid rgba(212,165,116,0.15);
}
.sidebar-header { padding:1.5rem 1.25rem; border-bottom:1px solid rgba(212,165,116,0.15); }
.sidebar-logo { font-size:1.3rem; font-weight:800; background:linear-gradient(135deg,#FFFDF9,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sidebar-user { font-size:.73rem; color:rgba(212,165,116,0.7); margin-top:.3rem; }
.sidebar-nav { flex:1; padding:1rem 0; overflow-y:auto; }
.nav-section { padding:.5rem 1.25rem; font-size:.62rem; font-weight:700; color:rgba(212,165,116,0.4); text-transform:uppercase; letter-spacing:.12em; margin-top:.5rem; }
.nav-item {
  display:flex; align-items:center; gap:.75rem; padding:.65rem 1.25rem;
  cursor:pointer; transition:.15s; color:rgba(255,255,255,.6); font-size:.87rem;
  border-left:3px solid transparent;
}
.nav-item:hover { background:rgba(212,165,116,0.08); color:rgba(255,255,255,.9); }
.nav-item.active { background:rgba(192,57,43,0.2); color:white; border-left-color:var(--accent); }
.nav-item .icon { font-size:1rem; width:20px; text-align:center; }
.sidebar-footer { padding:1rem 1.25rem; border-top:1px solid rgba(212,165,116,0.15); }
.btn-logout { width:100%; padding:.6rem; background:rgba(192,57,43,0.15); color:#E88; border:1px solid rgba(192,57,43,0.3); border-radius:var(--radius-sm); cursor:pointer; font-size:.83rem; font-weight:500; }

/* Main */
.main { margin-left:245px; flex:1; padding:2rem; background:var(--beige); min-height:100vh; }
.page { display:none; }
.page.active { display:block; }
.page-header { margin-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem; }
.page-header h2 { font-size:1.5rem; font-weight:800; color:var(--dark); }
.page-header p { color:var(--gray); font-size:.88rem; margin-top:.2rem; }

/* Hero banner */
.hero-banner {
  border-radius:var(--radius); overflow:hidden; margin-bottom:1.5rem;
  position:relative; min-height:180px; display:flex; align-items:flex-end;
  background-size:cover; background-position:center;
  box-shadow:var(--shadow);
}
.hero-banner::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(44,24,16,.85) 0%, rgba(44,24,16,.2) 60%, transparent 100%); }
.hero-content { position:relative; z-index:1; padding:1.5rem; color:white; width:100%; }
.hero-clock { font-size:2.8rem; font-weight:900; line-height:1; letter-spacing:-.02em; text-shadow:0 2px 8px rgba(0,0,0,.4); }
.hero-date { font-size:.88rem; opacity:.85; margin-top:.25rem; }
.hero-quote { font-size:.92rem; font-style:italic; opacity:.9; margin-top:.75rem; border-left:3px solid var(--accent); padding-left:.75rem; max-width:500px; }
.hero-quote-author { font-size:.75rem; opacity:.7; margin-top:.25rem; }

/* Cards */
.card { background:var(--white); border-radius:var(--radius); padding:1.5rem; box-shadow:var(--shadow); border:1px solid var(--border); }
.card-title { font-size:.95rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; color:var(--dark); }

/* Stats grid */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.stat-card {
  background:var(--white); border-radius:var(--radius); padding:1.25rem;
  box-shadow:var(--shadow); border:1px solid var(--border); position:relative; overflow:hidden;
}
.stat-card::before { content:''; position:absolute; top:-10px; right:-10px; width:70px; height:70px; border-radius:50%; opacity:.08; }
.stat-card.red::before { background:var(--primary); }
.stat-card.amber::before { background:var(--accent); }
.stat-card.green::before { background:var(--success); }
.stat-card.brown::before { background:var(--dark2); }
.stat-num { font-size:2.2rem; font-weight:900; color:var(--dark); }
.stat-label { font-size:.78rem; color:var(--gray); margin-top:.2rem; font-weight:500; }
.stat-icon { font-size:1.4rem; margin-bottom:.4rem; }

/* Grid layouts */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem; }

/* Tables */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.87rem; }
th { background:var(--beige); padding:.75rem 1rem; text-align:left; font-size:.72rem; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.06em; }
td { padding:.75rem 1rem; border-bottom:1px solid var(--border); color:var(--dark); }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--accent-light); }

/* Badges */
.badge { display:inline-block; padding:.22rem .65rem; border-radius:20px; font-size:.73rem; font-weight:700; }
.badge-red { background:#FDECEA; color:var(--primary); }
.badge-amber { background:#FEF3E2; color:#B7570A; }
.badge-green { background:#E8F8EF; color:#1A7A43; }
.badge-brown { background:var(--beige-dark); color:var(--dark2); }
.badge-gray { background:var(--beige); color:var(--gray); }
.badge-beige { background:var(--beige-dark); color:var(--dark); }

/* Buttons */
.btn { padding:.5rem 1rem; border-radius:var(--radius-sm); border:none; cursor:pointer; font-size:.84rem; font-weight:600; transition:.2s; }
.btn-sm { padding:.35rem .75rem; font-size:.77rem; }
.btn-red { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; box-shadow:0 2px 8px rgba(192,57,43,0.25); }
.btn-red:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(192,57,43,0.35); }
.btn-amber { background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:white; }
.btn-green { background:var(--success); color:white; }
.btn-danger { background:#FDECEA; color:var(--primary); border:1px solid #F5C6C2; }
.btn-outline { background:none; border:2px solid var(--border); color:var(--dark); }
.btn-outline:hover { border-color:var(--primary); color:var(--primary); }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(44,24,16,.55); z-index:1000; display:none; align-items:center; justify-content:center; padding:1rem; backdrop-filter:blur(4px); }
.modal-overlay.open { display:flex; }
.modal { background:var(--white); border-radius:var(--radius); padding:1.75rem; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; box-shadow:0 24px 80px rgba(44,24,16,.3); border:1px solid var(--border); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; }
.modal-title { font-size:1.1rem; font-weight:800; color:var(--dark); }
.modal-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray); line-height:1; }
.modal-footer { display:flex; gap:.75rem; justify-content:flex-end; margin-top:1.25rem; }

/* Form */
.input, .textarea, .select {
  width:100%; padding:.65rem .9rem; border:2px solid var(--border); border-radius:var(--radius-sm);
  font-size:.9rem; outline:none; transition:.2s; font-family:inherit; background:var(--white); color:var(--dark);
}
.input:focus, .textarea:focus, .select:focus { border-color:var(--primary); background:var(--white); }
.textarea { resize:vertical; min-height:90px; }
.form-row { margin-bottom:1rem; }
.form-label { display:block; font-size:.78rem; font-weight:700; color:var(--gray); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.04em; }

/* Toast */
#toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--dark); color:white; padding:.75rem 1.25rem; border-radius:var(--radius-sm); font-size:.85rem; z-index:9999; transform:translateY(100px); opacity:0; transition:.3s; max-width:300px; }
#toast.show { transform:translateY(0); opacity:1; }
#toast.success { background:var(--success); }
#toast.error { background:var(--primary); }

/* Confirm */
.confirm-overlay { position:fixed; inset:0; background:rgba(44,24,16,.55); z-index:2000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.confirm-overlay.open { display:flex; }
.confirm-box { background:var(--white); border-radius:var(--radius); padding:1.75rem; max-width:360px; width:90%; text-align:center; border:1px solid var(--border); }
.confirm-box h3 { margin-bottom:.5rem; color:var(--dark); }
.confirm-box p { color:var(--gray); font-size:.9rem; margin-bottom:1.25rem; }
.confirm-box .btns { display:flex; gap:.75rem; justify-content:center; }

/* Tabs */
.tabs { display:flex; gap:0; background:var(--beige-dark); border-radius:var(--radius-sm); padding:4px; margin-bottom:1.25rem; }
.tab-btn { flex:1; padding:.5rem .75rem; border-radius:6px; cursor:pointer; font-size:.82rem; font-weight:600; border:none; background:none; color:var(--gray); transition:.2s; white-space:nowrap; }
.tab-btn.active { background:var(--white); color:var(--primary); box-shadow:0 1px 6px rgba(192,57,43,0.15); }

/* Class card */
.class-card { background:var(--white); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow); }
.class-card-header { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; padding:1.25rem; }
.class-card-body { padding:1.25rem; }
.class-card-stat { display:flex; align-items:center; gap:.5rem; font-size:.83rem; color:var(--gray); padding:.4rem 0; border-bottom:1px solid var(--border); }
.class-card-stat:last-child { border-bottom:none; }

/* QA */
.qa-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.75rem; background:var(--white); }
.qa-item.answered { border-left:3px solid var(--success); }
.qa-meta { font-size:.73rem; color:var(--gray); margin-bottom:.4rem; }
.qa-answer { background:var(--accent-light); border-radius:var(--radius-sm); padding:.75rem; font-size:.88rem; margin-top:.5rem; border-left:3px solid var(--accent); }
.qa-answer-label { font-size:.7rem; font-weight:700; color:var(--accent-dark); margin-bottom:.3rem; }
.reactions { display:flex; gap:.4rem; margin-top:.6rem; flex-wrap:wrap; }
.reaction-btn { background:var(--beige); border:1px solid var(--border); border-radius:20px; padding:.22rem .65rem; cursor:pointer; font-size:.85rem; transition:.15s; color:var(--dark); }
.reaction-btn:hover, .reaction-btn.reacted { background:var(--primary-light); border-color:var(--primary); }

/* Confession */
.confession-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.75rem; background:var(--white); }

/* Schedule */
.schedule-item { display:flex; gap:1rem; padding:1rem; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:.75rem; background:var(--white); align-items:center; }
.schedule-date { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border-radius:var(--radius-sm); padding:.5rem .75rem; text-align:center; min-width:58px; box-shadow:0 2px 8px rgba(192,57,43,0.3); }
.schedule-date .day { font-size:1.5rem; font-weight:900; line-height:1; }
.schedule-date .month { font-size:.62rem; opacity:.85; }

/* Progress */
.progress-bar { background:var(--beige-dark); border-radius:20px; height:7px; overflow:hidden; }
.progress-fill { height:100%; border-radius:20px; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:.6s; }

/* Recording card */
.recording-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.75rem; display:flex; align-items:center; gap:1rem; background:var(--white); }
.recording-icon { font-size:2rem; }
.recording-info { flex:1; }
.recording-title { font-weight:700; font-size:.9rem; color:var(--dark); }
.recording-meta { font-size:.75rem; color:var(--gray); margin-top:.2rem; }

/* Empty state */
.empty { text-align:center; padding:3rem 1rem; color:var(--gray); }
.empty-icon { font-size:3rem; margin-bottom:.75rem; }
.empty p { font-size:.9rem; }

/* Code badge */
.code-badge { display:inline-block; background:linear-gradient(135deg,var(--primary),var(--accent-dark)); color:white; padding:.4rem 1rem; border-radius:var(--radius-sm); font-size:1.1rem; font-weight:800; letter-spacing:.12em; cursor:pointer; }

@media(max-width:768px){
  .sidebar{width:200px}
  .main{margin-left:200px;padding:1rem}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
