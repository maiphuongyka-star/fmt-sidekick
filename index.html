<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMT Sidekick</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #C0392B;
  --primary-light: #FDECEA;
  --primary-dark: #922B21;
  --accent: #D4A574;
  --accent-light: #FDF6EE;
  --accent-dark: #B8864A;
  --beige: #F5EFE6;
  --beige-dark: #EDE0D0;
  --success: #27AE60;
  --warning: #E67E22;
  --danger: #C0392B;
  --dark: #2C1810;
  --dark2: #4A2C1A;
  --gray: #8B7355;
  --gray-light: #F5EFE6;
  --white: #FFFDF9;
  --border: #E8D5C0;
  --shadow: 0 2px 16px rgba(192,57,43,0.08);
  --radius: 14px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', sans-serif; background:var(--beige); color:var(--dark); }

/* ── AUTH ── */
#auth-screen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #2C1810 0%, #C0392B 50%, #D4A574 100%);
  position:relative; overflow:hidden;
}
#auth-screen::before {
  content:''; position:absolute; inset:0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.auth-box {
  background:var(--white); border-radius:24px; padding:2.5rem; width:100%; max-width:420px;
  box-shadow:0 24px 80px rgba(44,24,16,0.4); position:relative; z-index:1;
}
.auth-logo { text-align:center; margin-bottom:1.5rem; }
.auth-logo h1 { font-size:2rem; font-weight:800; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.auth-logo p { color:var(--gray); font-size:.9rem; margin-top:.25rem; }
.auth-tabs { display:flex; gap:0; background:var(--beige); border-radius:var(--radius-sm); padding:4px; margin-bottom:1.5rem; }
.auth-tab { flex:1; padding:.5rem; text-align:center; border-radius:6px; cursor:pointer; font-size:.85rem; font-weight:500; border:none; background:none; color:var(--gray); transition:.2s; }
.auth-tab.active { background:var(--white); color:var(--primary); box-shadow:0 1px 6px rgba(192,57,43,0.15); }
.auth-form { display:none; }
.auth-form.active { display:block; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; font-size:.78rem; font-weight:700; color:var(--gray); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.06em; }
.form-group input {
  width:100%; padding:.75rem 1rem; border:2px solid var(--border); border-radius:var(--radius-sm);
  font-size:.95rem; outline:none; transition:.2s; background:var(--white); color:var(--dark);
}
.form-group input:focus { border-color:var(--primary); }
.btn-primary {
  width:100%; padding:.85rem; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none;
  border-radius:var(--radius-sm); font-size:1rem; font-weight:700; cursor:pointer; transition:.2s;
  box-shadow:0 4px 15px rgba(192,57,43,0.35);
}
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(192,57,43,0.45); }
.auth-msg { margin-top:.75rem; padding:.6rem 1rem; border-radius:var(--radius-sm); font-size:.85rem; text-align:center; display:none; }
.auth-msg.error { background:#FDECEA; color:var(--danger); display:block; }
.auth-msg.info { background:var(--accent-light); color:var(--accent-dark); display:block; }

/* ── APP ── */
#app { display:none; }
.app-layout { display:flex; min-height:100vh; }

/* Sidebar */
.sidebar {
  width:245px; background:var(--dark); color:white; flex-shrink:0;
  display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100;
  border-right:1px solid rgba(212,165,116,0.15);
}
.sidebar-header { padding:1.5rem 1.25rem; border-bottom:1px solid rgba(212,165,116,0.15); }
.sidebar-logo { font-size:1.3rem; font-weight:800; color:white; display:flex; align-items:center; gap:.4rem; }
.logo-icon { font-size:1.6rem; background:linear-gradient(135deg,#FFD700,#FF6B35); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 6px rgba(255,180,50,.6)); }
.sidebar-user { font-size:.73rem; color:rgba(212,165,116,0.7); margin-top:.3rem; }
.sidebar-nav { flex:1; padding:1rem 0; overflow-y:auto; }
.nav-section { padding:.5rem 1.25rem; font-size:.62rem; font-weight:700; color:rgba(212,165,116,0.4); text-transform:uppercase; letter-spacing:.12em; margin-top:.5rem; }
.nav-item {
  display:flex; align-items:center; gap:.75rem; padding:.65rem 1.25rem;
  cursor:pointer; transition:.15s; color:rgba(255,255,255,.6); font-size:.87rem;
  border-left:3px solid transparent;
}
.nav-item:hover { background:rgba(212,165,116,0.08); color:rgba(255,255,255,.9); }
.nav-item.active { background:rgba(192,57,43,0.2); color:white; border-left-color:var(--accent); }
.nav-item .icon { font-size:1rem; width:20px; text-align:center; }
.sidebar-footer { padding:1rem 1.25rem; border-top:1px solid rgba(212,165,116,0.15); }
.btn-logout { width:100%; padding:.6rem; background:rgba(192,57,43,0.15); color:#E88; border:1px solid rgba(192,57,43,0.3); border-radius:var(--radius-sm); cursor:pointer; font-size:.83rem; font-weight:500; }

/* Main */
.main { margin-left:245px; flex:1; padding:2rem; background:var(--beige); min-height:100vh; }
.page { display:none; }
.page.active { display:block; }
.page-header { margin-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem; }
.page-header h2 { font-size:1.5rem; font-weight:800; color:var(--dark); }
.page-header p { color:var(--gray); font-size:.88rem; margin-top:.2rem; }

/* Hero banner */
.hero-banner {
  border-radius:var(--radius); overflow:hidden; margin-bottom:1.5rem;
  position:relative; min-height:180px; display:flex; align-items:flex-end;
  background-size:cover; background-position:center;
  box-shadow:var(--shadow);
}
.hero-banner::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(44,24,16,.85) 0%, rgba(44,24,16,.2) 60%, transparent 100%); }
.hero-content { position:relative; z-index:1; padding:1.5rem; color:white; width:100%; }
.hero-clock { font-size:2.8rem; font-weight:900; line-height:1; letter-spacing:-.02em; text-shadow:0 2px 8px rgba(0,0,0,.4); }
.hero-date { font-size:.88rem; opacity:.85; margin-top:.25rem; }
.hero-quote { font-size:.92rem; font-style:italic; opacity:.9; margin-top:.75rem; border-left:3px solid var(--accent); padding-left:.75rem; max-width:500px; }
.hero-quote-author { font-size:.75rem; opacity:.7; margin-top:.25rem; }

/* Cards */
.card { background:var(--white); border-radius:var(--radius); padding:1.5rem; box-shadow:var(--shadow); border:1px solid var(--border); }
.card-title { font-size:.95rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; color:var(--dark); }

/* Stats grid */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1.5rem; }
.stat-card {
  background:var(--white); border-radius:var(--radius); padding:1.25rem;
  box-shadow:var(--shadow); border:1px solid var(--border); position:relative; overflow:hidden;
}
.stat-card::before { content:''; position:absolute; top:-10px; right:-10px; width:70px; height:70px; border-radius:50%; opacity:.08; }
.stat-card.red::before { background:var(--primary); }
.stat-card.amber::before { background:var(--accent); }
.stat-card.green::before { background:var(--success); }
.stat-card.brown::before { background:var(--dark2); }
.stat-num { font-size:2.2rem; font-weight:900; color:var(--dark); }
.stat-label { font-size:.78rem; color:var(--gray); margin-top:.2rem; font-weight:500; }
.stat-icon { font-size:1.4rem; margin-bottom:.4rem; }

/* Grid layouts */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem; }

/* Tables */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.87rem; }
th { background:var(--beige); padding:.75rem 1rem; text-align:left; font-size:.72rem; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.06em; }
td { padding:.75rem 1rem; border-bottom:1px solid var(--border); color:var(--dark); }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--accent-light); }

/* Badges */
.badge { display:inline-block; padding:.22rem .65rem; border-radius:20px; font-size:.73rem; font-weight:700; }
.badge-red { background:#FDECEA; color:var(--primary); }
.badge-amber { background:#FEF3E2; color:#B7570A; }
.badge-green { background:#E8F8EF; color:#1A7A43; }
.badge-brown { background:var(--beige-dark); color:var(--dark2); }
.badge-gray { background:var(--beige); color:var(--gray); }
.badge-beige { background:var(--beige-dark); color:var(--dark); }

/* Buttons */
.btn { padding:.5rem 1rem; border-radius:var(--radius-sm); border:none; cursor:pointer; font-size:.84rem; font-weight:600; transition:.2s; }
.btn-sm { padding:.35rem .75rem; font-size:.77rem; }
.btn-red { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; box-shadow:0 2px 8px rgba(192,57,43,0.25); }
.btn-red:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(192,57,43,0.35); }
.btn-amber { background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:white; }
.btn-green { background:var(--success); color:white; }
.btn-danger { background:#FDECEA; color:var(--primary); border:1px solid #F5C6C2; }
.btn-outline { background:none; border:2px solid var(--border); color:var(--dark); }
.btn-outline:hover { border-color:var(--primary); color:var(--primary); }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(44,24,16,.55); z-index:1000; display:none; align-items:center; justify-content:center; padding:1rem; backdrop-filter:blur(4px); }
.modal-overlay.open { display:flex; }
.modal { background:var(--white); border-radius:var(--radius); padding:1.75rem; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; box-shadow:0 24px 80px rgba(44,24,16,.3); border:1px solid var(--border); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; }
.modal-title { font-size:1.1rem; font-weight:800; color:var(--dark); }
.modal-close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray); line-height:1; }
.modal-footer { display:flex; gap:.75rem; justify-content:flex-end; margin-top:1.25rem; }

/* Form */
.input, .textarea, .select {
  width:100%; padding:.65rem .9rem; border:2px solid var(--border); border-radius:var(--radius-sm);
  font-size:.9rem; outline:none; transition:.2s; font-family:inherit; background:var(--white); color:var(--dark);
}
.input:focus, .textarea:focus, .select:focus { border-color:var(--primary); background:var(--white); }
.textarea { resize:vertical; min-height:90px; }
.form-row { margin-bottom:1rem; }
.form-label { display:block; font-size:.78rem; font-weight:700; color:var(--gray); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.04em; }

/* Toast */
#toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--dark); color:white; padding:.75rem 1.25rem; border-radius:var(--radius-sm); font-size:.85rem; z-index:9999; transform:translateY(100px); opacity:0; transition:.3s; max-width:300px; }
#toast.show { transform:translateY(0); opacity:1; }
#toast.success { background:var(--success); }
#toast.error { background:var(--primary); }

/* Confirm */
.confirm-overlay { position:fixed; inset:0; background:rgba(44,24,16,.55); z-index:2000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.confirm-overlay.open { display:flex; }
.confirm-box { background:var(--white); border-radius:var(--radius); padding:1.75rem; max-width:360px; width:90%; text-align:center; border:1px solid var(--border); }
.confirm-box h3 { margin-bottom:.5rem; color:var(--dark); }
.confirm-box p { color:var(--gray); font-size:.9rem; margin-bottom:1.25rem; }
.confirm-box .btns { display:flex; gap:.75rem; justify-content:center; }

/* Tabs */
.tabs { display:flex; gap:0; background:var(--beige-dark); border-radius:var(--radius-sm); padding:4px; margin-bottom:1.25rem; }
.tab-btn { flex:1; padding:.5rem .75rem; border-radius:6px; cursor:pointer; font-size:.82rem; font-weight:600; border:none; background:none; color:var(--gray); transition:.2s; white-space:nowrap; }
.tab-btn.active { background:var(--white); color:var(--primary); box-shadow:0 1px 6px rgba(192,57,43,0.15); }

/* Class card */
.class-card { background:var(--white); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow); }
.class-card-header { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; padding:1.25rem; }
.class-card-body { padding:1.25rem; }
.class-card-stat { display:flex; align-items:center; gap:.5rem; font-size:.83rem; color:var(--gray); padding:.4rem 0; border-bottom:1px solid var(--border); }
.class-card-stat:last-child { border-bottom:none; }

/* QA */
.qa-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.75rem; background:var(--white); }
.qa-item.answered { border-left:3px solid var(--success); }
.qa-meta { font-size:.73rem; color:var(--gray); margin-bottom:.4rem; }
.qa-answer { background:var(--accent-light); border-radius:var(--radius-sm); padding:.75rem; font-size:.88rem; margin-top:.5rem; border-left:3px solid var(--accent); }
.qa-answer-label { font-size:.7rem; font-weight:700; color:var(--accent-dark); margin-bottom:.3rem; }
.reactions { display:flex; gap:.4rem; margin-top:.6rem; flex-wrap:wrap; }
.reaction-btn { background:var(--beige); border:1px solid var(--border); border-radius:20px; padding:.22rem .65rem; cursor:pointer; font-size:.85rem; transition:.15s; color:var(--dark); }
.reaction-btn:hover, .reaction-btn.reacted { background:var(--primary-light); border-color:var(--primary); }

/* Confession */
.confession-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.75rem; background:var(--white); }

/* Schedule */
.schedule-item { display:flex; gap:1rem; padding:1rem; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:.75rem; background:var(--white); align-items:center; }
.schedule-date { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border-radius:var(--radius-sm); padding:.5rem .75rem; text-align:center; min-width:58px; box-shadow:0 2px 8px rgba(192,57,43,0.3); }
.schedule-date .day { font-size:1.5rem; font-weight:900; line-height:1; }
.schedule-date .month { font-size:.62rem; opacity:.85; }

/* Progress */
.progress-bar { background:var(--beige-dark); border-radius:20px; height:7px; overflow:hidden; }
.progress-fill { height:100%; border-radius:20px; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:.6s; }

/* Recording card */
.recording-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.75rem; display:flex; align-items:center; gap:1rem; background:var(--white); }
.recording-icon { font-size:2rem; }
.recording-info { flex:1; }
.recording-title { font-weight:700; font-size:.9rem; color:var(--dark); }
.recording-meta { font-size:.75rem; color:var(--gray); margin-top:.2rem; }

/* Empty state */
.empty { text-align:center; padding:3rem 1rem; color:var(--gray); }
.empty-icon { font-size:3rem; margin-bottom:.75rem; }
.empty p { font-size:.9rem; }

/* Code badge */
.code-badge { display:inline-block; background:linear-gradient(135deg,var(--primary),var(--accent-dark)); color:white; padding:.4rem 1rem; border-radius:var(--radius-sm); font-size:1.1rem; font-weight:800; letter-spacing:.12em; cursor:pointer; }

@media(max-width:768px){
  .sidebar{width:200px}
  .main{margin-left:200px;padding:1rem}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>✨ FMT Sidekick</h1>
      <p>Nền tảng học tập thông minh</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuth('login')">Đăng nhập</button>
      <button class="auth-tab" onclick="switchAuth('register')">Đăng ký</button>
    </div>
    <div id="form-login" class="auth-form active">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="email@example.com"></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" id="login-pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn-primary" onclick="doLogin()">🚀 Đăng nhập</button>
      <div id="login-msg" class="auth-msg"></div>
    </div>
    <div id="form-register" class="auth-form">
      <div class="form-group"><label>Mã lớp (giáo viên cấp)</label><input type="text" id="reg-code" placeholder="VD: FMT2024A" style="text-transform:uppercase"></div>
      <div class="form-group"><label>Họ và tên</label><input type="text" id="reg-name" placeholder="Nguyễn Văn A"></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="email@example.com"></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" id="reg-pwd" placeholder="Tối thiểu 6 ký tự" onkeydown="if(event.key==='Enter')doRegister()"></div>
      <button class="btn-primary" onclick="doRegister()">✅ Đăng ký</button>
      <div id="reg-msg" class="auth-msg"></div>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><span class="logo-icon">✦</span> FMT Sidekick</div>
        <div class="sidebar-user" id="sidebar-user-info">Đang tải...</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="doLogout()">🚪 Đăng xuất</button>
      </div>
    </aside>
    <main class="main" id="main-content"></main>
  </div>
</div>

<div id="toast"></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-title">Xác nhận</h3>
    <p id="confirm-msg">Bạn có chắc không?</p>
    <div class="btns">
      <button class="btn btn-outline" onclick="closeConfirm()">Huỷ</button>
      <button class="btn btn-red" id="confirm-ok">Xoá</button>
    </div>
  </div>
</div>

function toast(msg,type){ var t=g('toast'); t.textContent=msg; t.className='show '+(type||''); setTimeout(function(){ t.className=''; },3000); }
function showConfirm(title,msg,onOk){ g('confirm-title').textContent=title; g('confirm-msg').textContent=msg; g('confirm-overlay').classList.add('open'); g('confirm-ok').onclick=function(){ closeConfirm(); onOk(); }; }
function closeConfirm(){ g('confirm-overlay').classList.remove('open'); }
function openModal(id){ g(id)&&g(id).classList.add('open'); }
function closeModal(id){ g(id)&&g(id).classList.remove('open'); }
function fmtDate(d){ if(!d)return'—'; return new Date(d).toLocaleDateString('vi-VN'); }
function timeAgo(d){ var diff=(Date.now()-new Date(d))/1000; if(diff<60)return'vừa xong'; if(diff<3600)return Math.floor(diff/60)+' phút trước'; if(diff<86400)return Math.floor(diff/3600)+' giờ trước'; return Math.floor(diff/86400)+' ngày trước'; }
function setAuthMsg(id,msg,isError){ var el=g(id); if(!el)return; el.textContent=msg; el.className='auth-msg '+(isError?'error':'info'); }

// ── QUOTES ──
var quotes = [
  {text:"The secret of getting ahead is getting started.", author:"Mark Twain"},
  {text:"It always seems impossible until it's done.", author:"Nelson Mandela"},
  {text:"Don't watch the clock; do what it does. Keep going.", author:"Sam Levenson"},
  {text:"Believe you can and you're halfway there.", author:"Theodore Roosevelt"},
  {text:"Success is not final, failure is not fatal.", author:"Winston Churchill"},
  {text:"Learning is not attained by chance; it must be sought with ardor.", author:"Abigail Adams"},
  {text:"The beautiful thing about learning is nobody can take it away.", author:"B.B. King"},
  {text:"Push yourself, because no one else is going to do it for you.", author:"Unknown"},
  {text:"Wake up with determination. Go to bed with satisfaction.", author:"Unknown"},
  {text:"Small steps every day lead to big results.", author:"Unknown"},
  {text:"Your future is created by what you do today, not tomorrow.", author:"Robert Kiyosaki"},
  {text:"Hard work beats talent when talent doesn't work hard.", author:"Tim Notke"},
];
var quoteIdx = Math.floor(Math.random()*quotes.length);
function nextQuote(){ quoteIdx=(quoteIdx+1)%quotes.length; var q=quotes[quoteIdx]; var el=g('hero-quote'); var au=g('hero-quote-author'); if(el)el.textContent='"'+q.text+'"'; if(au)au.textContent='— '+q.author; }

// ── HERO BACKGROUNDS ──
var heroBgs = [
  'https://images.unsplash.com/photo-1501504905252-473c47e087f8?w=1200&q=80',
  'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=1200&q=80',
  'https://images.unsplash.com/photo-1513258496099-48168024aec0?w=1200&q=80',
  'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=1200&q=80',
  'https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?w=1200&q=80',
  'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=1200&q=80',
];
var bgIdx = 0;
function nextBg(){ bgIdx=(bgIdx+1)%heroBgs.length; var el=g('hero-banner'); if(el) el.style.backgroundImage='url('+heroBgs[bgIdx]+')'; }

// ── CLOCK ──
function startClock(){
  var el=g('clock-display'); if(!el)return;
  // Set initial bg & quote
  var banner=g('hero-banner');
  if(banner) banner.style.backgroundImage='url('+heroBgs[bgIdx]+')';
  var q=quotes[quoteIdx];
  var qel=g('hero-quote'); var au=g('hero-quote-author');
  if(qel) qel.textContent='"'+q.text+'"';
  if(au) au.textContent='— '+q.author;

  function tick(){
    var now=new Date();
    var h=now.getHours().toString().padStart(2,'0');
    var m=now.getMinutes().toString().padStart(2,'0');
    var s=now.getSeconds().toString().padStart(2,'0');
    el.textContent=h+':'+m+':'+s;
    var de=g('hero-date-display');
    if(de){ var days=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy']; de.textContent=days[now.getDay()]+', '+now.toLocaleDateString('vi-VN'); }
  }
  tick(); setInterval(tick,1000);
  // Change quote every 30s, bg every 60s
  setInterval(nextQuote, 30000);
  setInterval(nextBg, 60000);
}

// ── AUTH ──
function switchAuth(tab){
  ['login','register'].forEach(function(t){ g('form-'+t).classList.toggle('active',t===tab); });
  document.querySelectorAll('.auth-tab').forEach(function(btn,i){ btn.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')); });
}
async function checkSession(){ if(!sb)return; var s=await sb.auth.getSession(); if(s.data&&s.data.session){ currentUser=s.data.session.user; await loadProfile(); } }
async function loadProfile(){ if(!currentUser||!sb)return; var r=await sb.from('profiles').select('*').eq('id',currentUser.id).single(); if(r.data){ currentProfile=r.data; showApp(); } }
async function doLogin(){ var email=v('login-email'),pwd=v('login-pwd'); if(!email||!pwd){setAuthMsg('login-msg','Vui lòng điền đầy đủ',true);return;} if(!sb){ setAuthMsg('login-msg','Đang kết nối...', false); var tries=0; var wait=setInterval(function(){ tries++; if(sb){ clearInterval(wait); doLogin(); } else if(tries>20){ clearInterval(wait); setAuthMsg('login-msg','Không kết nối được. Thử tải lại trang.',true); }},500); return;} setAuthMsg('login-msg','Đang đăng nhập...',false); var r=await sb.auth.signInWithPassword({email:email,password:pwd}); if(r.error){setAuthMsg('login-msg',r.error.message,true);return;} currentUser=r.data.user; await loadProfile(); }
async function doRegister(){ var code=v('reg-code').toUpperCase(),name=v('reg-name'),email=v('reg-email'),pwd=v('reg-pwd'); if(!code||!name||!email||!pwd){setAuthMsg('reg-msg','Vui lòng điền đầy đủ',true);return;} if(pwd.length<6){setAuthMsg('reg-msg','Mật khẩu ít nhất 6 ký tự',true);return;} if(!sb){setAuthMsg('reg-msg','Không kết nối Supabase',true);return;} setAuthMsg('reg-msg','Đang kiểm tra mã lớp...',false); var ic=await sb.from('invite_codes').select('*').eq('code',code).limit(1); if(!ic.data||!ic.data.length){setAuthMsg('reg-msg','Mã lớp không đúng',true);return;} var inv=ic.data[0]; setAuthMsg('reg-msg','Đang tạo tài khoản...',false); var reg=await sb.auth.signUp({email:email,password:pwd}); if(reg.error){setAuthMsg('reg-msg',reg.error.message,true);return;} await sb.from('profiles').upsert({id:reg.data.user.id,name:name,email:email,role:'student',class_id:inv.class_id}); setAuthMsg('reg-msg','✅ Đăng ký thành công! Vào lớp: '+(inv.class_name||code),false); setTimeout(function(){ switchAuth('login'); g('login-email').value=email; },2000); }
async function doLogout(){ if(sb)await sb.auth.signOut(); currentUser=null; currentProfile=null; g('app').style.display='none'; g('auth-screen').style.display='flex'; }
function showDemoMode(){ currentProfile={id:'demo',name:'Giáo viên Demo',role:'teacher',class_id:1}; showApp(); }
</script>

var teacherNav=[

  {section:'Lớp học'},{id:'classes',icon:'🏫',label:'Quản lý lớp'},
  {section:'Nội dung'},{id:'students',icon:'👥',label:'Học sinh'},{id:'sessions',icon:'📹',label:'Buổi học & Recording'},{id:'exercises',icon:'📝',label:'Bài tập'},
  {section:'Tương tác'},{id:'qa',icon:'❓',label:'Q&A'},{id:'confessions',icon:'💌',label:'Tâm sự'},{id:'notifications',icon:'🔔',label:'Thông báo'},
  {section:'Báo cáo'},{id:'reports',icon:'📈',label:'Báo cáo'},
];
var studentNav=[
  {section:'Học tập'},{id:'s-dashboard',icon:'🏠',label:'Dashboard'},{id:'s-sessions',icon:'📹',label:'Buổi học'},{id:'s-exercises',icon:'📝',label:'Bài tập'},{id:'s-results',icon:'🏆',label:'Kết quả'},
  {section:'Cộng đồng'},{id:'s-qa',icon:'❓',label:'Q&A'},{id:'s-confessions',icon:'💌',label:'Tâm sự'},{id:'s-notifications',icon:'🔔',label:'Thông báo'},
];

function buildNav(items){ var nav=g('sidebar-nav'); nav.innerHTML=''; items.forEach(function(item){ if(item.section){ nav.innerHTML+='<div class="nav-section">'+item.section+'</div>'; } else { nav.innerHTML+='<div class="nav-item" id="nav-'+item.id+'" onclick="showPage(\''+item.id+'\')"><span class="icon">'+item.icon+'</span>'+item.label+'</div>'; } }); }

function showPage(id){
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.page').forEach(function(el){ el.classList.remove('active'); });
  var navEl=g('nav-'+id); if(navEl)navEl.classList.add('active');
  var pageEl=g('page-'+id); if(pageEl)pageEl.classList.add('active');
  var loaders={
    'dashboard':loadTeacherDashboard,'classes':loadClasses,'students':loadStudents,
    'sessions':loadSessions,'exercises':loadExercises,'qa':loadQA,
    'confessions':loadConfessions,'notifications':loadNotifications,
    'reports':loadReports,'schedule':loadSchedule,
    's-dashboard':loadStudentDashboard,'s-sessions':loadStudentSessions,
    's-exercises':loadStudentExercises,'s-results':loadStudentResults,
    's-qa':loadStudentQA,'s-confessions':loadStudentConfessions,'s-notifications':loadStudentNotifications,
  };
  if(loaders[id]) loaders[id]();
}

function showApp(){
  g('auth-screen').style.display='none'; g('app').style.display='block';
  var isT=currentProfile&&currentProfile.role==='teacher';
  g('sidebar-user-info').textContent=(currentProfile?currentProfile.name:'')+' · '+(isT?'👨‍🏫 Giáo viên':'🎓 Học sinh');
  buildNav(isT?teacherNav:studentNav);
  g('main-content').innerHTML=isT?teacherPages():studentPages();
  showPage(isT?'dashboard':'s-dashboard');
  setTimeout(startClock,100);
}

function switchTab(group,value,btn){
  if(group==='ex-tab') loadExercises(value);
  if(group==='qa-tab') loadQA(value);
  if(group==='notif-tab') loadNotifications(value);
  if(group==='s-ex-tab') loadStudentExercises(value);
  var tabs=event.target.closest('.tabs');
  if(tabs) tabs.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
}
</script>

<script>
// ══════════════════════════════════════════════════════
// TEACHER DATA
// ══════════════════════════════════════════════════════
var classesCache=[], studentsCache=[];

async function getClasses(){ if(!sb)return[]; var r=await sb.from('classes').select('*').eq('teacher_id',currentProfile.id).order('created_at'); classesCache=r.data||[]; return classesCache; }

async function loadTeacherDashboard(){
  if(!sb){renderDemoDashboard();return;}
  var classes=await getClasses();
  var classIds=classes.map(function(c){return c.id;});
  if(!classIds.length){g('stat-students').textContent='0';g('stat-pending').textContent='0';g('stat-qa').textContent='0';g('stat-sessions').textContent='0';renderDashboardCharts([]);renderTodo(0,0);return;}
  var stuRes=await sb.from('profiles').select('*').eq('role','student').in('class_id',classIds);
  studentsCache=stuRes.data||[];
  g('stat-students').textContent=studentsCache.length;
  var exRes=await sb.from('exercises').select('id').in('class_id',classIds);
  var exIds=(exRes.data||[]).map(function(e){return e.id;});
  var pendSub=0;
  if(exIds.length){var subRes=await sb.from('submissions').select('id').in('exercise_id',exIds).is('score',null); pendSub=(subRes.data||[]).length;}
  g('stat-pending').textContent=pendSub;
  var qaRes=await sb.from('qa_items').select('id').in('class_id',classIds).is('answer',null);
  g('stat-qa').textContent=(qaRes.data||[]).length;
  var sesRes=await sb.from('sessions').select('id').in('class_id',classIds);
  g('stat-sessions').textContent=(sesRes.data||[]).length;
  renderDashboardCharts(classes);
  renderTodo(pendSub,(qaRes.data||[]).length);
}

function renderTodo(pending,unanswered){
  var html='';
  if(pending>0) html+=`<div style="display:flex;align-items:center;gap:.75rem;padding:.75rem;border-bottom:1px solid var(--border)"><span>📝</span><span>Có <strong>${pending}</strong> bài chờ chấm</span><button class="btn btn-sm btn-red" onclick="showPage('exercises')" style="margin-left:auto">Chấm ngay</button></div>`;
  if(unanswered>0) html+=`<div style="display:flex;align-items:center;gap:.75rem;padding:.75rem"><span>❓</span><span>Có <strong>${unanswered}</strong> câu hỏi chưa trả lời</span><button class="btn btn-sm btn-red" onclick="showPage('qa')" style="margin-left:auto">Trả lời</button></div>`;
  if(!html) html='<div class="empty"><div class="empty-icon">✅</div><p>Không có việc cần xử lý</p></div>';
  g('todo-list').innerHTML=html;
}

function renderDashboardCharts(classes){
  var labels=classes.map(function(c){return c.name.substring(0,10);});
  var c1=g('chart-submissions');
  if(c1){if(c1._chart)c1._chart.destroy(); c1._chart=new Chart(c1,{type:'bar',data:{labels:labels.length?labels:['Chưa có lớp'],datasets:[{label:'Bài đã nộp',data:classes.map(function(){return Math.floor(Math.random()*20+5);}),backgroundColor:'rgba(192,57,43,.75)',borderRadius:8,borderColor:'rgba(192,57,43,1)',borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});}
  var c2=g('chart-activity');
  if(c2){if(c2._chart)c2._chart.destroy(); c2._chart=new Chart(c2,{type:'doughnut',data:{labels:['Đã nộp','Chờ chấm','Có điểm'],datasets:[{data:[65,20,15],backgroundColor:['rgba(192,57,43,.8)','rgba(212,165,116,.8)','rgba(39,174,96,.8)'],borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}});}
}

function renderDemoDashboard(){g('stat-students').textContent='12';g('stat-pending').textContent='3';g('stat-qa').textContent='2';g('stat-sessions').textContent='8';renderDashboardCharts([{name:'IELTS A'},{name:'IELTS B'}]);renderTodo(3,2);}

async function loadClasses(){
  var classes=await getClasses();
  if(!classes.length){g('classes-list').innerHTML='<div class="empty"><div class="empty-icon">🏫</div><p>Chưa có lớp nào. Tạo lớp đầu tiên!</p></div>';return;}
  var html='<div class="grid-2">';
  classes.forEach(function(c){
    html+=`<div class="class-card">
      <div class="class-card-header">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div><div style="font-size:1.15rem;font-weight:800">${c.name}</div><div style="font-size:.82rem;opacity:.85;margin-top:.2rem">${c.description||''}</div></div>
          <div style="display:flex;gap:.4rem"><button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:white;border:1px solid rgba(255,255,255,.3)" onclick="deleteClass(${c.id},'${c.name}')">🗑</button></div>
        </div>
        <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
          ${c.midterm_date?`<span style="background:rgba(255,255,255,.2);color:white;font-size:.75rem;padding:.2rem .6rem;border-radius:20px">📋 Midterm: ${fmtDate(c.midterm_date)}</span>`:''}
          ${c.final_date?`<span style="background:rgba(255,255,255,.2);color:white;font-size:.75rem;padding:.2rem .6rem;border-radius:20px">🎓 Final: ${fmtDate(c.final_date)}</span>`:''}
        </div>
      </div>
      <div class="class-card-body">
        <div class="class-card-stat">🔑 Mã mời: <span class="code-badge" id="code-${c.id}" onclick="copyCode('${c.id}')">...</span><button class="btn btn-sm btn-outline" onclick="generateCode(${c.id})" style="margin-left:auto">🔄 Tạo mới</button></div>
        <div class="class-card-stat">👥 Học sinh: <span id="count-stu-${c.id}">...</span></div>
        <div class="class-card-stat">📝 Bài tập: <span id="count-ex-${c.id}">...</span></div>
        <div class="class-card-stat">📹 Buổi học: <span id="count-ses-${c.id}">...</span></div>
      </div>
    </div>`;
  });
  html+='</div>';
  g('classes-list').innerHTML=html;
  classes.forEach(function(c){loadInviteCode(c.id);loadClassStats(c.id);});
}

async function loadClassStats(classId){
  if(!sb)return;
  var stu=await sb.from('profiles').select('id',{count:'exact'}).eq('class_id',classId).eq('role','student');
  var ex=await sb.from('exercises').select('id',{count:'exact'}).eq('class_id',classId);
  var ses=await sb.from('sessions').select('id',{count:'exact'}).eq('class_id',classId);
  var s=g('count-stu-'+classId); if(s)s.textContent=(stu.count||0)+' học sinh';
  var e=g('count-ex-'+classId); if(e)e.textContent=(ex.count||0)+' bài';
  var ss=g('count-ses-'+classId); if(ss)ss.textContent=(ses.count||0)+' buổi';
}

async function loadInviteCode(classId){
  if(!sb)return;
  var r=await sb.from('invite_codes').select('code').eq('class_id',classId).order('created_at',{ascending:false}).limit(1);
  var el=g('code-'+classId); if(el)el.textContent=(r.data&&r.data.length)?r.data[0].code:'—';
}

function copyCode(classId){ var el=g('code-'+classId); if(el&&navigator.clipboard){navigator.clipboard.writeText(el.textContent);toast('Đã sao chép mã: '+el.textContent,'success');} }

async function addClass(){
  var name=v('new-class-name'),desc=v('new-class-desc'),midterm=g('new-class-midterm').value,final=g('new-class-final').value;
  if(!name){toast('Vui lòng nhập tên lớp','error');return;}
  if(!sb){toast('Không kết nối Supabase','error');return;}
  var r=await sb.from('classes').insert({name:name,description:desc,teacher_id:currentProfile.id,midterm_date:midterm||null,final_date:final||null}).select().single();
  if(r.error){toast('Lỗi: '+r.error.message,'error');return;}
  closeModal('modal-add-class'); toast('Đã tạo lớp '+name,'success');
  ['new-class-name','new-class-desc'].forEach(function(id){g(id).value='';});
  loadClasses();
}

async function deleteClass(id,name){ showConfirm('Xoá lớp học','Xoá lớp "'+name+'"? Không thể hoàn tác.',async function(){ await sb.from('classes').delete().eq('id',id); toast('Đã xoá lớp '+name); loadClasses(); }); }

async function generateCode(classId){
  if(!sb)return;
  var code='FMT'+Math.random().toString(36).substring(2,7).toUpperCase();
  var cls=classesCache.find(function(c){return c.id===classId;});
  await sb.from('invite_codes').insert({code:code,class_id:classId,class_name:cls?cls.name:'',teacher_id:currentProfile.id});
  toast('✅ Mã mời: '+code+' (đã sao chép)','success');
  navigator.clipboard&&navigator.clipboard.writeText(code);
  loadInviteCode(classId);
}

async function loadStudents(){
  var classes=await getClasses();
  var classIds=classes.map(function(c){return c.id;});
  if(!classIds.length){g('students-tbody').innerHTML='<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--gray)">Chưa có lớp nào</td></tr>';return;}
  var r=await sb.from('profiles').select('*').eq('role','student').in('class_id',classIds);
  var students=r.data||[];
  if(!students.length){g('students-tbody').innerHTML='<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--gray)">Chưa có học sinh</td></tr>';return;}
  var html='';
  students.forEach(function(s){
    var cls=classesCache.find(function(c){return c.id===s.class_id;});
    html+=`<tr><td><strong>${s.name}</strong></td><td style="color:var(--gray)">${s.email}</td><td><span class="badge badge-red">${cls?cls.name:'—'}</span></td><td>—</td><td>—</td><td><button class="btn btn-sm btn-danger" onclick="removeStudent('${s.id}','${s.name}')">Xoá</button></td></tr>`;
  });
  g('students-tbody').innerHTML=html;
}

async function removeStudent(id,name){ showConfirm('Xoá học sinh','Xoá "'+name+'" khỏi lớp?',async function(){ await sb.from('profiles').delete().eq('id',id); toast('Đã xoá '+name); loadStudents(); }); }

async function loadSessions(){
  var classes=await getClasses();
  var classIds=classes.map(function(c){return c.id;});
  populateClassDropdown('session-class-id',classes);
  populateClassDropdown('session-filter-class',classes,true);
  if(!classIds.length){g('sessions-list').innerHTML='<div class="empty"><div class="empty-icon">📹</div><p>Chưa có buổi học</p></div>';return;}
  var filterCls=g('session-filter-class')&&g('session-filter-class').value;
  var q=sb.from('sessions').select('*').in('class_id',classIds).order('session_date',{ascending:false});
  if(filterCls) q=q.eq('class_id',parseInt(filterCls));
  var r=await q;
  var sessions=r.data||[];
  if(!sessions.length){g('sessions-list').innerHTML='<div class="empty"><div class="empty-icon">📹</div><p>Chưa có buổi học nào</p></div>';return;}
  var html='';
  sessions.forEach(function(s){
    var cls=classesCache.find(function(c){return c.id===s.class_id;});
    html+=`<div class="card" style="margin-bottom:.75rem">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div><div style="font-weight:700">${s.title}</div><div style="font-size:.8rem;color:var(--gray);margin-top:.25rem">📅 ${fmtDate(s.session_date)} · <span class="badge badge-red">${cls?cls.name:'—'}</span></div>${s.note?`<div style="font-size:.85rem;color:var(--gray);margin-top:.4rem">${s.note}</div>`:''}</div>
        <button class="btn btn-sm btn-danger" onclick="deleteSession(${s.id},'${s.title}')">🗑</button>
      </div>
      <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
        ${s.recording_url?`<a href="${s.recording_url}" target="_blank" class="btn btn-sm btn-red">🎥 Recording</a>`:'<span class="badge badge-gray">Chưa có recording</span>'}
        ${s.attachment_url?`<a href="${s.attachment_url}" target="_blank" class="btn btn-sm btn-outline">📎 Tài liệu</a>`:''}
      </div>
    </div>`;
  });
  g('sessions-list').innerHTML=html;
}

async function addSession(){
  var classId=g('session-class-id').value,title=v('session-title'),date=g('session-date').value,rec=v('session-recording'),att=v('session-attachment'),note=v('session-note');
  if(!classId||!title){toast('Vui lòng chọn lớp và nhập tiêu đề','error');return;}
  var r=await sb.from('sessions').insert({class_id:parseInt(classId),title:title,session_date:date||null,recording_url:rec||null,attachment_url:att||null,note:note||null});
  if(r.error){toast('Lỗi: '+r.error.message,'error');return;}
  closeModal('modal-add-session'); toast('Đã thêm buổi học','success'); loadSessions();
}

async function deleteSession(id,title){ showConfirm('Xoá buổi học','Xoá "'+title+'"?',async function(){ await sb.from('sessions').delete().eq('id',id); toast('Đã xoá'); loadSessions(); }); }

async function loadExercises(filter){
  filter=filter||'all';
  var classes=await getClasses();
  var classIds=classes.map(function(c){return c.id;});
  populateClassDropdown('ex-class-id',classes);
  populateClassDropdown('ex-filter-class',classes,true);
  if(!classIds.length){g('exercises-list').innerHTML='<div class="empty"><div class="empty-icon">📝</div><p>Chưa có bài tập</p></div>';return;}
  var filterCls=g('ex-filter-class')&&g('ex-filter-class').value;
  var q=sb.from('exercises').select('*').in('class_id',classIds).order('created_at',{ascending:false});
  if(filterCls) q=q.eq('class_id',parseInt(filterCls));
  var exRes=await q;
  var exercises=exRes.data||[];
  if(!exercises.length){g('exercises-list').innerHTML='<div class="empty"><div class="empty-icon">📝</div><p>Chưa có bài tập nào</p></div>';return;}
  var html='';
  for(var i=0;i<exercises.length;i++){
    var ex=exercises[i];
    var cls=classesCache.find(function(c){return c.id===ex.class_id;});
    var subRes=await sb.from('submissions').select('*,profiles(name)').eq('exercise_id',ex.id);
    var subs=subRes.data||[];
    var pending=subs.filter(function(s){return s.score===null;});
    var graded=subs.filter(function(s){return s.score!==null;});
    if(filter==='pending'&&!pending.length)continue;
    if(filter==='done'&&!graded.length)continue;
    var totalStu=studentsCache.filter(function(s){return s.class_id===ex.class_id;}).length;
    var prog=totalStu?Math.round(subs.length/totalStu*100):0;
    html+=`<div class="card" style="margin-bottom:.75rem">
      <div style="display:flex;justify-content:space-between;align-items:start">

<script>
// ══════════════════════════════════════════════════════
// STUDENT DATA
// ══════════════════════════════════════════════════════
var myClass=null;

async function getMyClass(){if(!sb||!currentProfile)return null;var r=await sb.from('classes').select('*').eq('id',currentProfile.class_id).single();myClass=r.data;return myClass;}

async function loadStudentDashboard(){
  var cls=await getMyClass();
  if(g('student-name-display'))g('student-name-display').textContent=currentProfile.name;
  if(g('student-class-display'))g('student-class-display').textContent=cls?'🏫 Lớp: '+cls.name:'Chưa có lớp';
  if(!cls)return;
  var sesRes=await sb.from('sessions').select('id',{count:'exact'}).eq('class_id',cls.id);
  if(g('s-stat-sessions'))g('s-stat-sessions').textContent=sesRes.count||0;
  var exRes=await sb.from('exercises').select('id').eq('class_id',cls.id);
  var exIds=(exRes.data||[]).map(function(e){return e.id;});
  if(exIds.length){
    var subRes=await sb.from('submissions').select('*').eq('student_id',currentProfile.id).in('exercise_id',exIds);
    var subs=subRes.data||[];
    var graded=subs.filter(function(s){return s.score!==null;});
    var avg=graded.length?(graded.reduce(function(a,s){return a+parseFloat(s.score);},0)/graded.length).toFixed(1):'—';
    if(g('s-stat-submitted'))g('s-stat-submitted').textContent=subs.length;
    if(g('s-stat-pending'))g('s-stat-pending').textContent=subs.filter(function(s){return s.score===null;}).length;
    if(g('s-stat-avg'))g('s-stat-avg').textContent=avg;
  }
  var now=new Date();
  var exAllRes=await sb.from('exercises').select('*').eq('class_id',cls.id).not('deadline','is',null).order('deadline');
  var upcoming=(exAllRes.data||[]).filter(function(e){return new Date(e.deadline)>now;}).slice(0,5);
  var dlEl=g('s-upcoming-deadlines');
  if(dlEl){dlEl.innerHTML=upcoming.length?upcoming.map(function(e){return`<div style="display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border)"><span>📝</span><span style="flex:1">${e.title}</span><span class="badge badge-amber">⏰ ${fmtDate(e.deadline)}</span></div>`;}).join(''):'<div class="empty"><div class="empty-icon">🎉</div><p>Không có deadline sắp tới</p></div>';}
}

async function loadStudentExercises(filter){
  filter=filter||'todo';
  var cls=await getMyClass();
  if(!cls){g('s-exercises-list').innerHTML='<div class="empty"><div class="empty-icon">📝</div><p>Chưa có bài tập</p></div>';return;}
  var exRes=await sb.from('exercises').select('*').eq('class_id',cls.id).order('created_at',{ascending:false});
  var exercises=exRes.data||[];
  var exIds=exercises.map(function(e){return e.id;});
  var subMap={};
  if(exIds.length){var subRes=await sb.from('submissions').select('*').eq('student_id',currentProfile.id).in('exercise_id',exIds);(subRes.data||[]).forEach(function(s){subMap[s.exercise_id]=s;});}
  var html='';

    if(filter==='done'&&!submitted)return;
    html+=`<div class="card" style="margin-bottom:.75rem${overdue?';border-left:3px solid var(--danger)':''}">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div><div style="font-weight:700">${ex.title}</div>${ex.deadline?`<div style="font-size:.8rem;color:${overdue?'var(--danger)':'var(--gray)'};margin-top:.2rem">⏰ ${fmtDate(ex.deadline)}${overdue?' (Quá hạn)':''}</div>`:''} ${ex.description?`<div style="font-size:.85rem;color:var(--gray);margin-top:.35rem">${ex.description}</div>`:''}</div>
        ${submitted?'<span class="badge badge-green">✅ Đã nộp</span>':'<span class="badge badge-amber">📌 Chưa nộp</span>'}
      </div>
      ${ex.link?`<div style="margin-top:.5rem"><a href="${ex.link}" target="_blank" class="btn btn-sm btn-outline">📄 Xem đề bài</a></div>`:''}
      ${submitted?`<div style="margin-top:.75rem;background:var(--beige);border-radius:var(--radius-sm);padding:.75rem">
        <div style="font-size:.78rem;font-weight:700;margin-bottom:.25rem;color:var(--gray)">📤 Bài đã nộp</div>
        ${sub.drive_link?`<a href="${sub.drive_link}" target="_blank" style="color:var(--primary);font-size:.85rem">🔗 Xem bài làm</a>`:''}
        ${sub.score!==null?`<div style="margin-top:.35rem"><span class="badge badge-green">⭐ Điểm: ${sub.score}/10</span></div>`:'<div style="font-size:.78rem;color:var(--gray);margin-top:.25rem">⏳ Chờ chấm điểm</div>'}
        ${sub.teacher_comment?`<div style="font-size:.85rem;margin-top:.35rem;color:var(--gray);font-style:italic">💬 "${sub.teacher_comment}"</div>`:''}
      </div>`:`<div style="margin-top:.75rem"><button class="btn btn-red" onclick="openSubmitEx(${ex.id},'${ex.title.replace(/'/g,"\\'")}')">📤 Nộp bài</button></div>`}
    </div>`;
  });
  if(!html)html='<div class="empty"><div class="empty-icon">📝</div><p>Không có bài tập '+(filter==='todo'?'cần làm':'đã nộp')+'</p></div>';
  g('s-exercises-list').innerHTML=html;
}

function openSubmitEx(id,title){g('submit-ex-id').value=id;g('submit-ex-title').textContent='📝 '+title;g('submit-link').value='';g('submit-note').value='';openModal('modal-submit-ex');}
async function submitExercise(){var exId=parseInt(g('submit-ex-id').value),link=v('submit-link'),note=v('submit-note');var r=await sb.from('submissions').insert({exercise_id:exId,student_id:currentProfile.id,drive_link:link||null,note:note||null,submitted_at:new Date().toISOString()});if(r.error){toast('Lỗi: '+r.error.message,'error');return;}closeModal('modal-submit-ex');toast('Đã nộp bài!','success');loadStudentExercises();}

async function loadStudentResults(){
  var cls=await getMyClass();

  if(!subs.length){g('s-results-content').innerHTML='<div class="empty"><div class="empty-icon">🏆</div><p>Chưa có bài được chấm</p></div>';return;}
  var exMap={};(exRes.data||[]).forEach(function(e){exMap[e.id]=e;});
  var avg=(subs.reduce(function(a,s){return a+parseFloat(s.score);},0)/subs.length).toFixed(1);
  g('s-results-content').innerHTML=`<div class="stats-grid" style="margin-bottom:1.5rem"><div class="stat-card red"><div class="stat-icon">📝</div><div class="stat-num">${subs.length}</div><div class="stat-label">Bài đã chấm</div></div><div class="stat-card green"><div class="stat-icon">⭐</div><div class="stat-num">${avg}</div><div class="stat-label">Điểm trung bình</div></div></div><div class="card"><div class="card-title">📊 Chi tiết điểm</div><div class="table-wrap"><table><thead><tr><th>Bài tập</th><th>Điểm</th><th>Nhận xét</th><th>Ngày chấm</th></tr></thead><tbody>${subs.map(function(s){var ex=exMap[s.exercise_id];return`<tr><td>${ex?ex.title:'—'}</td><td><span class="badge ${parseFloat(s.score)>=8?'badge-green':parseFloat(s.score)>=6?'badge-amber':'badge-red'}">${s.score}/10</span></td><td style="font-size:.85rem;color:var(--gray);font-style:italic">${s.teacher_comment||'—'}</td><td>${fmtDate(s.graded_at)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
}

async function loadStudentQA(){
  var cls=await getMyClass();
  if(!cls){g('s-qa-list').innerHTML='<div class="empty"><div class="empty-icon">❓</div><p>Chưa có câu hỏi</p></div>';return;}
  var r=await sb.from('qa_items').select('*,profiles(name)').eq('class_id',cls.id).order('created_at',{ascending:false});
  var items=r.data||[];
  var html='';
  items.forEach(function(item){
    var isMe=item.student_id===currentProfile.id;
    html+=`<div class="qa-item ${item.answer?'answered':''}">
      <div class="qa-meta">${item.is_anonymous?'🎭 Ẩn danh':(item.profiles?'👤 '+item.profiles.name:'—')} · ${timeAgo(item.created_at)}</div>
      <div style="font-size:.92rem;margin:.35rem 0">${item.question}</div>
      ${item.answer?`<div class="qa-answer"><div class="qa-answer-label">💬 Giáo viên trả lời</div>${item.answer}</div>`:'<span class="badge badge-gray">⏳ Chờ giáo viên trả lời</span>'}
      <div class="reactions" id="reactions-${item.id}"></div>
      ${isMe?`<div style="display:flex;justify-content:flex-end;margin-top:.5rem"><button class="btn btn-sm btn-danger" onclick="deleteMyQA(${item.id})">🗑</button></div>`:''}
    </div>`;
  });
  if(!html)html='<div class="empty"><div class="empty-icon">❓</div><p>Chưa có câu hỏi nào. Hỏi điều gì đó!</p></div>';
  g('s-qa-list').innerHTML=html;
  items.forEach(function(item){loadReactions(item.id);});
}

async function loadReactions(qaId){var el=g('reactions-'+qaId);if(!el)return;var r=await sb.from('qa_reactions').select('emoji').eq('qa_id',qaId);var counts={};(r.data||[]).forEach(function(rx){counts[rx.emoji]=(counts[rx.emoji]||0)+1;});el.innerHTML=['👍','❤️','🤔','😮'].map(function(e){return`<button class="reaction-btn" onclick="toggleReaction(${qaId},'${e}')">${e} ${counts[e]||0}</button>`;}).join('');}
async function toggleReaction(qaId,emoji){var check=await sb.from('qa_reactions').select('id').eq('qa_id',qaId).eq('user_id',currentProfile.id).eq('emoji',emoji).limit(1);if(check.data&&check.data.length){await sb.from('qa_reactions').delete().eq('id',check.data[0].id);}else{await sb.from('qa_reactions').insert({qa_id:qaId,user_id:currentProfile.id,emoji:emoji});}loadReactions(qaId);}

async function submitQuestion(){var cls=await getMyClass();var text=v('qa-question-text'),anon=g('qa-anonymous').checked;if(!text){toast('Vui lòng nhập câu hỏi','error');return;}await sb.from('qa_items').insert({class_id:cls.id,question:text,student_id:currentProfile.id,is_anonymous:anon});closeModal('modal-ask-qa');toast('Đã gửi câu hỏi!','success');g('qa-question-text').value='';loadStudentQA();}
async function deleteMyQA(id){showConfirm('Xoá câu hỏi','Xoá câu hỏi của bạn?',async function(){await sb.from('qa_items').delete().eq('id',id).eq('student_id',currentProfile.id);toast('Đã xoá');loadStudentQA();});}

async function loadStudentConfessions(){
  var cls=await getMyClass();
  if(!cls){g('s-confessions-list').innerHTML='<div class="empty"><div class="empty-icon">💌</div><p>Chưa có chia sẻ</p></div>';return;}
  var r=await sb.from('confessions').select('*').eq('class_id',cls.id).eq('student_id',currentProfile.id).order('created_at',{ascending:false});
  var items=r.data||[];
  g('s-confessions-list').innerHTML=items.length?items.map(function(item){return`<div class="confession-item"><div class="confession-meta">${item.is_anonymous?'🎭 Ẩn danh':'👤 Bạn'} · ${timeAgo(item.created_at)}</div><div style="font-size:.9rem;margin-top:.25rem">${item.content}</div><div style="display:flex;justify-content:flex-end;margin-top:.5rem"><button class="btn btn-sm btn-danger" onclick="deleteMyConfession(${item.id})">🗑</button></div></div>`;}).join(''):'<div class="empty"><div class="empty-icon">💌</div><p>Chia sẻ cảm nhận, góp ý với giáo viên!</p></div>';
}
async function submitConfession(){var cls=await getMyClass();var text=v('confession-text'),anon=g('confession-anon').checked;if(!text){toast('Vui lòng nhập nội dung','error');return;}await sb.from('confessions').insert({class_id:cls.id,content:text,student_id:currentProfile.id,is_anonymous:anon});closeModal('modal-add-confession');toast('Đã gửi!','success');g('confession-text').value='';loadStudentConfessions();}
async function deleteMyConfession(id){showConfirm('Xoá','Xoá chia sẻ này?',async function(){await sb.from('confessions').delete().eq('id',id).eq('student_id',currentProfile.id);toast('Đã xoá');loadStudentConfessions();});}

async function loadStudentNotifications(){
  var cls=await getMyClass();
  if(!cls){g('s-notif-list').innerHTML='<div class="empty"><div class="empty-icon">🔔</div><p>Chưa có thông báo</p></div>';return;}
  var r=await sb.from('notifications').select('*').or('class_id.eq.'+cls.id+',class_id.is.null').order('created_at',{ascending:false});
  var items=r.data||[];
  g('s-notif-list').innerHTML=items.length?items.map(function(n){return`<div class="card" style="margin-bottom:.75rem"><div style="font-weight:700">${n.title}</div><div style="font-size:.75rem;color:var(--gray);margin-bottom:.4rem">${timeAgo(n.created_at)}</div><div style="font-size:.9rem">${n.body}</div></div>`;}).join(''):'<div class="empty"><div class="empty-icon">🔔</div><p>Chưa có thông báo</p></div>';
}
</script>
